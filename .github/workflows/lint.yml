name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Lint
              run: npx eslint src

            - name: Regression tests
              run: npm test

            - name: Verify release
              run: npm run verify:release

    obsidian-compatibility:
        name: Obsidian API ${{ matrix.obsidian }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                obsidian: ['1.5.7', 'latest']

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Select Obsidian API version
              run: npm install --no-save --no-audit --no-fund obsidian@${{ matrix.obsidian }}

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build
